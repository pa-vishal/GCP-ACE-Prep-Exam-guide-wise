<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PSA → PSC Evolution</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto;
  background: #f4f6fb;
  padding: 24px;
}
.container {
  max-width: 1200px;
  margin: auto;
  background: white;
  padding: 32px;
  border-radius: 14px;
  box-shadow: 0 12px 28px rgba(0,0,0,.08);
}
h1, h2 {
  text-align: center;
}
.diagram {
  margin-top: 40px;
  display: flex;
  justify-content: center;
}
svg {
  width: 100%;
  max-width: 1100px;
}
.box {
  fill: #eef2ff;
  stroke: #4f46e5;
  stroke-width: 2;
  rx: 12;
}
.host {
  fill: #ecfeff;
  stroke: #0891b2;
}
.psa {
  fill: #fef3c7;
  stroke: #d97706;
}
.psc {
  fill: #fdf4ff;
  stroke: #a855f7;
}
.arrow {
  stroke: #374151;
  stroke-width: 2;
  marker-end: url(#arrowhead);
}
.label {
  font-size: 14px;
  font-weight: 600;
  text-anchor: middle;
}
.small {
  font-size: 12px;
  font-weight: 400;
}
</style>
</head>

<body>
<div class="container">
<h1>Private Service Access → Private Service Connect</h1>
<h2>How GCP Private Connectivity Evolves</h2>

<div class="diagram">
<svg viewBox="0 0 1100 520">
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7"
          refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
  </marker>
</defs>

<!-- Shared VPC -->
<rect x="420" y="200" width="260" height="120" class="box host"/>
<text x="550" y="230" class="label">Shared VPC</text>
<text x="550" y="255" class="label small">Your Network</text>

<!-- PSA Path -->
<rect x="160" y="60" width="260" height="120" class="box psa"/>
<text x="290" y="90" class="label">Cloud SQL (Old)</text>
<text x="290" y="115" class="label small">Private Service Access</text>
<text x="290" y="135" class="label small">Network Peering</text>

<line x1="420" y1="220" x2="290" y2="180" class="arrow"/>
<text x="350" y="195" class="label small">PSA</text>

<!-- PSC Path -->
<rect x="700" y="60" width="260" height="120" class="box psc"/>
<text x="830" y="90" class="label">Cloud SQL (New)</text>
<text x="830" y="115" class="label small">Private Service Connect</text>
<text x="830" y="135" class="label small">Service Endpoint</text>

<line x1="680" y1="220" x2="830" y2="180" class="arrow"/>
<text x="760" y="195" class="label small">PSC Endpoint</text>

<!-- Evolution Arrow -->
<line x1="420" y1="120" x2="700" y2="120" class="arrow"/>
<text x="560" y="100" class="label small">Evolution</text>

</svg>
</div>

</div>
</body>
</html>
