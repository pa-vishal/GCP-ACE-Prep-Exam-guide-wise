<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GCP Master Network Mental Model</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
  background: #f4f6fb;
  padding: 24px;
  color: #111827;
}
.container {
  max-width: 1300px;
  margin: auto;
  background: white;
  padding: 32px;
  border-radius: 14px;
  box-shadow: 0 12px 28px rgba(0,0,0,.08);
}
h1, h2 {
  text-align: center;
  margin-bottom: 8px;
}
.diagram {
  margin-top: 40px;
  display: flex;
  justify-content: center;
}
svg {
  width: 100%;
  max-width: 1200px;
  height: auto;
}
.box {
  fill: #eef2ff;
  stroke: #4f46e5;
  stroke-width: 2;
  rx: 12;
}
.host {
  fill: #ecfeff;
  stroke: #0891b2;
}
.serverless {
  fill: #f0fdf4;
  stroke: #16a34a;
}
.google {
  fill: #fef3c7;
  stroke: #d97706;
}
.endpoint {
  fill: #fdf4ff;
  stroke: #a855f7;
}
.label {
  font-size: 14px;
  font-weight: 600;
  text-anchor: middle;
}
.small {
  font-size: 12px;
  font-weight: 400;
}
.arrow {
  stroke: #374151;
  stroke-width: 2;
  marker-end: url(#arrowhead);
}
</style>
</head>

<body>
<div class="container">

<h1>GCP Master Network Mental Model</h1>
<h2>Shared VPC • Serverless VPC Access • PGA • PSA • PSC</h2>

<div class="diagram">
<svg viewBox="0 0 1200 780">
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7"
          refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
  </marker>
</defs>

<!-- Shared VPC -->
<rect x="360" y="240" width="480" height="280" class="box host"/>
<text x="600" y="270" class="label">Shared VPC (Host Project)</text>
<text x="600" y="295" class="label small">Subnets • Routes • Firewall • NAT</text>

<!-- Serverless -->
<rect x="80" y="80" width="260" height="120" class="box serverless"/>
<text x="210" y="110" class="label">Serverless</text>
<text x="210" y="135" class="label small">Cloud Run / Functions</text>

<rect x="120" y="220" width="180" height="70" class="box"/>
<text x="210" y="250" class="label small">Serverless VPC Access</text>

<!-- Arrow -->
<line x1="210" y1="200" x2="210" y2="220" class="arrow"/>
<line x1="300" y1="255" x2="360" y2="340" class="arrow"/>
<text x="285" y="310" class="label small">Private Entry</text>

<!-- VM / GKE -->
<rect x="900" y="260" width="240" height="120" class="box"/>
<text x="1020" y="290" class="label">VMs / GKE</text>
<text x="1020" y="315" class="label small">Private IPs Only</text>

<line x1="900" y1="320" x2="840" y2="360" class="arrow"/>

<!-- Private Google Access -->
<rect x="880" y="100" width="260" height="100" class="box google"/>
<text x="1010" y="130" class="label">Google APIs</text>
<text x="1010" y="155" class="label small">Private Google Access</text>

<line x1="1020" y1="260" x2="1020" y2="200" class="arrow"/>
<text x="1035" y="225" class="label small">API Traffic</text>

<!-- Private Service Access -->
<rect x="360" y="560" width="220" height="100" class="box google"/>
<text x="470" y="590" class="label">Cloud SQL</text>
<text x="470" y="615" class="label small">Private Service Access</text>

<line x1="600" y1="520" x2="470" y2="560" class="arrow"/>
<text x="520" y="545" class="label small">PSA</text>

<!-- Private Service Connect -->
<rect x="700" y="560" width="220" height="100" class="box endpoint"/>
<text x="810" y="590" class="label">PSC Endpoint</text>
<text x="810" y="615" class="label small">Private Service Connect</text>

<line x1="700" y1="610" x2="600" y2="520" class="arrow"/>
<text x="675" y="560" class="label small">Private Endpoint</text>

</svg>
</div>

</div>
</body>
</html>
